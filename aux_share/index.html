<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <title>AuxShare — Your playlist. Their platform.</title>
    <meta
      name="description"
      content="Share a Spotify or YouTube Music playlist with someone on another music platform. AuxShare finds the same songs on Spotify, Apple Music or YouTube Music."
    />
    <meta name="author" content="AuxShare" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#2452ff" />
    <meta name="application-name" content="AuxShare" />
    <meta name="apple-mobile-web-app-title" content="AuxShare" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AuxShare" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta
      property="og:title"
      content="AuxShare — Your playlist. Their platform."
    />
    <meta
      property="og:description"
      content="Your friend uses another music app? Share a Spotify or YouTube Music playlist on Spotify, Apple Music or YouTube Music with one AuxShare link."
    />
    <meta property="og:image" content="__SITE_URL__/playlist-sharing-preview.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/playlist-sharing-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The same For you playlist on Spotify and Apple Music, connected by a sharing arrow — AuxShare"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AuxShare — Your playlist. Their platform."
    />
    <meta
      name="twitter:description"
      content="Share your playlist with someone on another music app. Same songs, their platform — Spotify, Apple Music or YouTube Music."
    />
    <meta name="twitter:image" content="__SITE_URL__/playlist-sharing-preview.jpg" />
    <meta
      name="twitter:image:alt"
      content="The same For you playlist on Spotify and Apple Music, connected by a sharing arrow — AuxShare"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AuxShare",
        "url": "__SITE_URL__/",
        "description": "Your friend uses another music app? Share a Spotify or YouTube Music playlist on Spotify, Apple Music or YouTube Music with one AuxShare link.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Convert Spotify playlists to Apple Music and YouTube Music",
          "Convert YouTube Music playlists to Spotify and Apple Music",
          "Confidence-scored track matching with review UI",
          "Shareable playlist links — no account required",
          "Export matched playlist directly to Spotify"
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
